name: Seed working repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout working repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone original project
        run: git clone --depth 1 https://github.com/deekshita655/smart-ac-platform.git /tmp/source

      - name: Copy project without secrets or git metadata
        run: |
          rsync -a --delete --exclude='.git/' --exclude='.env' --exclude='backend/.env' --exclude='frontend/.env' --exclude='.github/' /tmp/source/ ./
          rm -f backend/.env frontend/.env .env

      - name: Commit seeded project
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: seed working repo from smart-ac-platform' || exit 0
          git push origin HEAD:main
